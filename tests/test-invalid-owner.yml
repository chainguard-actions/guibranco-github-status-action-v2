name: Test invalid owner is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          authToken: ${{ secrets.GITHUB_TOKEN }}
          state: success
          owner: "-invalid_owner!"
          repository: hello-world
      - name: Assert action failed on invalid owner
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid owner, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
